[project]
name = "part-labels"
version = "0.1.0"
description = "Turn a .form file into a billing summary and a bag label for each part."
requires-python = ">=3.11"
dependencies = [
  "formlabs-sdk @ git+https://github.com/Formlabs/formlabs-api-python@v1.0.0-alpha.post1",
  "pymupdf>=1.24",
]

# An example to run with `uv run`, not a package to build.
[tool.uv]
package = false
