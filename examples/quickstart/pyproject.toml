[project]
name = "quickstart"
version = "0.1.0"
description = "Prepare an STL file for a Form 4, then queue it on a printer or save it as a .form file."
requires-python = ">=3.11"
dependencies = [
  "formlabs-sdk @ git+https://github.com/Formlabs/formlabs-api-python@v1.0.0-alpha.post2",
]

# An example to run with `uv run`, not a package to build.
[tool.uv]
package = false
