[project]
name = "print-setting-rollout"
version = "0.1.0"
description = "Move every queued job from one print setting to another."
requires-python = ">=3.11"
dependencies = [
  "formlabs-sdk @ git+https://github.com/Formlabs/formlabs-api-python@v1.0.0-alpha.post1",
]

# An example to run with `uv run`, not a package to build.
[tool.uv]
package = false
