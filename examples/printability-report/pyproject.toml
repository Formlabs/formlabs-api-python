[project]
name = "printability-report"
version = "0.1.0"
description = "Check a set of STL files before a job is confirmed: will each part print as it is?"
requires-python = ">=3.11"
dependencies = [
  "formlabs-sdk @ git+https://github.com/Formlabs/formlabs-api-python@v1.0.0-alpha.post1",
]

# An example to run with `uv run`, not a package to build.
[tool.uv]
package = false
