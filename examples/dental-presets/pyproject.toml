[project]
name = "dental-presets"
version = "0.1.0"
description = "Apply a print preset to a set of scans and save a print-ready .form file."
requires-python = ">=3.11"
dependencies = [
  "formlabs-sdk @ git+https://github.com/Formlabs/formlabs-api-python@v1.0.0-alpha.post1",
]

# An example to run with `uv run`, not a package to build.
[tool.uv]
package = false
