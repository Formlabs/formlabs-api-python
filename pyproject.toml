[project]
name = "formlabs-sdk"
version = "1.0.0-alpha.post1"
description = "Formlabs SDK for the PreForm API"
authors = [
  {name = "Formlabs"},
]
license = { text = "Proprietary" }
readme = "README.md"
keywords = ["Formlabs", "SDK", "PreForm", "Dashboard", "Fleet Control"]
requires-python = ">=3.11"

dependencies = [
  "httpx>=0.27,<1.0",
  "attrs>=22.2",
  "formlabs-preform-api @ https://downloads.formlabs.com/PreFormServer/Release/3.64.0/formlabs_preform_api-1.0.0a0-3.64.0_release_releaser_663_140194-py3-none-any.whl#sha256=6d6e15172f5e5fee3549b47b543bf032d5585c43b1e6ef5a0a14915f06e93885",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  # test_examples.py: the type check, and the spec-driven stand-in PreForm Server the examples run against.
  "mypy>=1.10",
  "pyyaml>=6",
  "jsonschema>=4.18",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["formlabs_sdk*"]

[tool.setuptools.package-data]
formlabs_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
